<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniTask | Gestor Universitario</title>

<style>
:root{
    --bg:#0f1115;
    --sidebar:#15181e;
    --card:#181c23;
    --card2:#1d222b;
    --border:#2a303b;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --accent:#7c6df2;
    --accent2:#9387ff;
    --danger:#ef4444;
    --success:#22c55e;
    --warning:#f59e0b;
    --blue:#3b82f6;
    --radius:12px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:grid;
    grid-template-columns:240px 1fr;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:22px 14px;
    position:fixed;
    width:240px;
    height:100vh;
    overflow:auto;
}

.brand{
    font-size:21px;
    font-weight:800;
    margin:0 10px 25px;
}

.brand span{
    color:var(--accent2);
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav button{
    background:transparent;
    border:0;
    color:var(--muted);
    padding:11px 12px;
    border-radius:8px;
    text-align:left;
    display:flex;
    gap:10px;
    align-items:center;
}

.nav button:hover,
.nav button.active{
    background:#20242c;
    color:white;
}

.sidebar-bottom{
    margin-top:30px;
    border-top:1px solid var(--border);
    padding-top:15px;
}

.main{
    grid-column:2;
    padding:30px 38px;
    max-width:1600px;
    width:100%;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.topbar h1{
    margin:0;
    font-size:28px;
}

.subtitle{
    color:var(--muted);
    margin-top:5px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* BUTTONS */

.btn{
    border:1px solid var(--border);
    background:#20242c;
    color:white;
    padding:10px 14px;
    border-radius:8px;
}

.btn:hover{
    background:#292e38;
}

.btn.primary{
    background:var(--accent);
    border-color:var(--accent);
}

.btn.primary:hover{
    background:var(--accent2);
}

.btn.danger{
    color:#fecaca;
}

.btn.small{
    padding:6px 9px;
    font-size:13px;
}

.icon-btn{
    background:transparent;
    border:0;
    color:var(--muted);
    font-size:22px;
    padding:5px 8px;
    border-radius:6px;
}

.icon-btn:hover{
    background:#292e38;
    color:white;
}

/* DASHBOARD */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    padding:20px;
    border-radius:var(--radius);
}

.stat-value{
    font-size:29px;
    font-weight:800;
    margin-top:7px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:18px;
}

.panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
}

.panel-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.panel-title h2{
    margin:0;
    font-size:17px;
}

/* TABLE */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    color:var(--muted);
    font-size:12px;
    text-align:left;
    font-weight:600;
    padding:11px 9px;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px 9px;
    border-bottom:1px solid var(--border);
    font-size:14px;
    vertical-align:middle;
}

tr:hover td{
    background:#1b1f27;
}

.task-title{
    font-weight:600;
}

.muted{
    color:var(--muted);
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:4px 8px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

.status-no{
    background:#282d36;
    color:#d1d5db;
}

.status-progress{
    background:#312e81;
    color:#c7d2fe;
}

.status-done{
    background:#14532d;
    color:#bbf7d0;
}

.status-late{
    background:#7f1d1d;
    color:#fecaca;
}

.priority-low{
    color:#86efac;
}

.priority-medium{
    color:#fde68a;
}

.priority-high{
    color:#fdba74;
}

.priority-urgent{
    color:#fca5a5;
    font-weight:700;
}

/* PROGRESS */

.progress{
    width:90px;
    height:6px;
    background:#303641;
    border-radius:10px;
    overflow:hidden;
}

.progress div{
    height:100%;
    background:var(--accent);
}

/* FILTERS */

.filters{
    display:flex;
    gap:9px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.search,
.filter-select{
    background:#171a20;
    border:1px solid var(--border);
    color:white;
    padding:10px 12px;
    border-radius:8px;
}

.search{
    flex:1;
    min-width:220px;
}

/* COURSES */

.course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:15px;
}

.course-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    position:relative;
}

.course-line{
    height:5px;
    border-radius:5px;
    margin-bottom:15px;
}

.course-card h3{
    margin:0 0 5px;
}

.course-meta{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.course-actions{
    display:flex;
    gap:6px;
    margin-top:15px;
}

/* RESPONSABLES */

.responsible-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:18px;
}

.responsible-card{
    --resp-accent:var(--accent);
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,#1a1f28 0%,#151920 100%);
    border:1px solid #303746;
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 28px rgba(0,0,0,.16);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}

.responsible-card::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:4px;
    background:linear-gradient(90deg,var(--resp-accent),transparent);
}

.responsible-card:hover{
    transform:translateY(-2px);
    border-color:color-mix(in srgb,var(--resp-accent) 55%,#303746);
    box-shadow:0 14px 34px rgba(0,0,0,.22);
}

.responsible-head{
    display:flex;
    align-items:center;
    gap:13px;
}

.responsible-avatar{
    width:48px;
    height:48px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--resp-accent),#332d58);
    border:1px solid rgba(255,255,255,.10);
    font-weight:900;
    color:white;
    letter-spacing:.4px;
    flex:0 0 auto;
    box-shadow:0 7px 18px color-mix(in srgb,var(--resp-accent) 22%,transparent);
}

.responsible-name{
    font-weight:800;
    font-size:17px;
}

.responsible-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.responsible-stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.responsible-stat{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 9px;
    border:1px solid var(--border);
    border-radius:999px;
    background:#12161d;
    color:#cbd5e1;
    font-size:12px;
}

.responsible-stat.pending{
    border-color:color-mix(in srgb,var(--resp-accent) 45%,var(--border));
    color:#f3f4f6;
}

.responsible-actions{
    display:flex;
    gap:7px;
    margin-top:16px;
    flex-wrap:wrap;
}

.responsible-actions .pending-btn{
    background:color-mix(in srgb,var(--resp-accent) 18%,#20242c);
    border-color:color-mix(in srgb,var(--resp-accent) 45%,var(--border));
}

.responsible-actions .pending-btn:hover{
    background:color-mix(in srgb,var(--resp-accent) 28%,#20242c);
}

.responsible-pending{
    display:none;
    margin-top:16px;
    padding-top:15px;
    border-top:1px solid var(--border);
}

.responsible-pending.open{
    display:block;
}

.responsible-pending-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
    font-size:13px;
    font-weight:800;
}

.pending-task-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.pending-task-item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    padding:10px 11px;
    border:1px solid #2a3140;
    border-left:3px solid var(--task-color,var(--resp-accent));
    border-radius:10px;
    background:#11151c;
}

.pending-task-item:hover{
    background:#171c24;
}

.pending-task-name{
    font-size:13px;
    font-weight:700;
}

.pending-task-meta{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
}

.pending-task-actions{
    display:flex;
    align-items:center;
    gap:5px;
}

.pending-empty{
    color:var(--muted);
    font-size:13px;
    padding:10px 0 2px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

/* CALENDAR */

.calendar-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.calendar-item{
    display:grid;
    grid-template-columns:75px 1fr auto;
    gap:15px;
    align-items:center;
    padding:14px;
    background:var(--card2);
    border-radius:9px;
}

.date-box{
    text-align:center;
    border-right:1px solid var(--border);
}

.date-day{
    font-size:23px;
    font-weight:800;
}

.date-month{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
}

/* MODALS */

dialog{
    border:1px solid var(--border);
    background:#171a20;
    color:white;
    border-radius:14px;
    padding:0;
    width:min(720px,94vw);
    max-height:90vh;
    overflow:auto;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

dialog::backdrop{
    background:rgba(0,0,0,.72);
}

.modal-head{
    padding:18px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    background:#171a20;
    z-index:2;
}

.modal-head h2{
    margin:0;
    font-size:19px;
}

.modal-body{
    padding:22px;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:16px 22px;
    border-top:1px solid var(--border);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    color:#d1d5db;
}

input,
select,
textarea{
    width:100%;
    background:#111419;
    color:white;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 11px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--accent);
}

textarea{
    resize:vertical;
    min-height:90px;
}

/* CALENDARIO MENSUAL */
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.calendar-toolbar h2{margin:0;font-size:19px;text-transform:capitalize}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border);min-width:760px}.calendar-weekday{padding:10px;text-align:center;color:var(--muted);font-size:12px;font-weight:700;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#13171d}.calendar-day{min-height:125px;padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#171a20}.calendar-day.other{opacity:.35}.calendar-day.today{outline:2px solid var(--accent);outline-offset:-2px}.calendar-number{font-size:12px;color:var(--muted);margin-bottom:7px}.calendar-task{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:#222731;color:#fff;border-radius:5px;padding:6px 7px;margin:5px 0;font-size:11px;overflow:hidden}.calendar-task:hover{background:#2a303b}.calendar-task-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendar-task-meta{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.calendar-scroll{overflow:auto}.calendar-detail{margin-top:16px}.calendar-detail h3{margin-top:0}

/* SELECTOR DE MÚLTIPLES RESPONSABLES */
.responsible-picker{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:9px;
    background:#111419;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    max-height:220px;
    overflow:auto;
}

.responsible-picker.empty-picker{
    display:block;
    color:var(--muted);
    padding:14px;
}

.responsible-option{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#181c23;
    cursor:pointer;
    transition:.18s ease;
    user-select:none;
}

.responsible-option:hover{
    border-color:#4b5563;
    background:#20242c;
}

.responsible-option.selected{
    border-color:var(--resp-accent,#7c6df2);
    box-shadow:0 0 0 1px color-mix(in srgb, var(--resp-accent,#7c6df2) 45%, transparent);
    background:color-mix(in srgb, var(--resp-accent,#7c6df2) 12%, #181c23);
}

.responsible-option input{
    width:16px;
    height:16px;
    margin:0;
    accent-color:var(--resp-accent,#7c6df2);
}

.responsible-option-avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    display:grid;
    place-items:center;
    flex:0 0 auto;
    background:color-mix(in srgb, var(--resp-accent,#7c6df2) 20%, #20242c);
    color:#fff;
    font-size:12px;
    font-weight:800;
}

.responsible-option-name{
    font-size:13px;
    font-weight:650;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.form-help{
    color:var(--muted);
    font-size:12px;
}

.task-responsibles{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:5px;
}

.task-responsible-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 7px;
    border-radius:999px;
    font-size:11px;
    line-height:1.2;
    background:color-mix(in srgb, var(--chip-color,#7c6df2) 16%, #20242c);
    border:1px solid color-mix(in srgb, var(--chip-color,#7c6df2) 38%, var(--border));
    color:#e5e7eb;
}

.task-responsible-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--chip-color,#7c6df2);
}

/* RESPONSIVE */

@media(max-width:950px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){
    .app{
        display:block;
    }

    .sidebar{
        position:static;
        width:100%;
        height:auto;
    }

    .nav{
        flex-direction:row;
        overflow:auto;
    }

    .nav button{
        white-space:nowrap;
    }

    .main{
        padding:20px 15px;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="brand">🎓 Uni<span>Task</span></div>

    <nav class="nav">
        <button class="active" data-view="dashboard">🏠 Dashboard</button>
        <button data-view="tasks">📋 Mis tareas</button>
        <button data-view="calendar">📅 Calendario</button>
        <button data-view="courses">📚 Cursos</button>
        <button data-view="responsibles">👥 Responsables</button>
        <button data-view="completed">✅ Completadas</button>
    </nav>

    <div class="sidebar-bottom">
        <button class="btn" style="width:100%;margin-bottom:8px" onclick="exportData()">
            ⬇ Exportar respaldo
        </button>

        <button class="btn" style="width:100%" onclick="document.getElementById('importFile').click()">
            ⬆ Importar respaldo
        </button>

        <input
            type="file"
            id="importFile"
            accept=".json"
            hidden
            onchange="importData(event)"
        >
    </div>

</aside>

<main class="main">

    <div class="topbar">

        <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="subtitle" id="pageSubtitle">
                Resumen de tus actividades universitarias.
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="newCourseTop" onclick="openCourseModal()">
                + Curso
            </button>

            <button class="btn" id="newResponsibleTop" onclick="openResponsibleModal()">
                + Responsable
            </button>

            <button class="btn primary" onclick="openTaskModal()">
                + Nueva tarea
            </button>
        </div>

    </div>

    <div id="content"></div>

</main>
</div>

<!-- ===================================================== -->
<!-- MODAL TAREA -->
<!-- ===================================================== -->

<dialog id="taskDialog">

<form id="taskForm">

    <div class="modal-head">
        <h2 id="taskModalTitle">Nueva tarea</h2>

        <button
            type="button"
            class="icon-btn"
            onclick="closeTaskModal()"
            aria-label="Cerrar">
            ✕
        </button>
    </div>

    <div class="modal-body">

        <div class="form-grid">

            <div class="form-group full">
                <label>Nombre de la tarea *</label>
                <input id="taskName" required placeholder="Ej. Avance del proyecto">
            </div>

            <div class="form-group">
                <label>Curso *</label>
                <select id="taskCourse" required></select>
            </div>

            <div class="form-group">
                <label>Tipo de actividad</label>
                <select id="taskType">
                    <option>Tarea</option>
                    <option>Proyecto</option>
                    <option>Examen</option>
                    <option>Quiz</option>
                    <option>Exposición</option>
                    <option>Laboratorio</option>
                    <option>Lectura</option>
                    <option>Investigación</option>
                    <option>Reunión</option>
                    <option>Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select id="taskStatus">
                    <option value="No iniciada">No iniciada</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Completada">Completada</option>
                </select>
            </div>

            <div class="form-group">
                <label>Prioridad</label>
                <select id="taskPriority">
                    <option value="Baja">Baja</option>
                    <option value="Media" selected>Media</option>
                    <option value="Alta">Alta</option>
                    <option value="Urgente">Urgente</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha de entrega</label>
                <input type="date" id="taskDate">
            </div>

            <div class="form-group">
                <label>Hora</label>
                <input type="time" id="taskTime">
            </div>

            <div class="form-group">
                <label>Modalidad</label>
                <select id="taskMode">
                    <option>Individual</option>
                    <option>Grupal</option>
                </select>
            </div>

            <div class="form-group">
                <label>Progreso (%)</label>
                <input
                    type="number"
                    id="taskProgress"
                    min="0"
                    max="100"
                    value="0"
                >
            </div>

            <div class="form-group full">
                <label>Responsables</label>
                <div id="taskResponsiblePicker" class="responsible-picker"></div>
                <div class="form-help">Seleccioná todas las personas necesarias para esta tarea.</div>
            </div>

            <div class="form-group full">
                <label>Enlace</label>
                <input
                    type="url"
                    id="taskLink"
                    placeholder="https://..."
                >

<script>

/* =========================================================
   ALMACENAMIENTO
========================================================= */

const TASK_KEY = "unitask_tasks_v1";
const COURSE_KEY = "unitask_courses_v1";
const RESPONSIBLE_KEY = "unitask_responsibles_v1";

/* Supabase: almacenamiento compartido */
const SUPABASE_URL = "https://jyznqkmxzquajxagywru.supabase.co";
const SUPABASE_KEY = "sb_publishable_7lxWrK_pUPW68XOA1PC6Aw_aoafA42n";
const SUPABASE_HEADERS = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json"
};

let tasks = JSON.parse(localStorage.getItem(TASK_KEY) || "[]");
let courses = JSON.parse(localStorage.getItem(COURSE_KEY) || "[]");
let responsibles = JSON.parse(localStorage.getItem(RESPONSIBLE_KEY) || "[]");
let cloudReady = false;
let cloudSyncTimer = null;

let currentView = "dashboard";
let editingTaskId = null;
let editingCourseId = null;
let editingResponsibleId = null;
let calendarCursor = new Date();
calendarCursor.setDate(1);

/* =========================================================
   UTILIDADES
========================================================= */

function id(){
    return Date.now().toString(36) +
           Math.random().toString(36).substring(2);
}

function escapeHTML(value=""){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function save(){
    localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    localStorage.setItem(COURSE_KEY, JSON.stringify(courses));
    localStorage.setItem(RESPONSIBLE_KEY, JSON.stringify(responsibles));

    if(cloudReady){
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => {
            syncAllToCloud().catch(showCloudError);
        }, 150);
    }
}

function showCloudError(error){
    console.error("UniTask / Supabase:", error);
    const message = String(error && error.message ? error.message : error);
    if(!window.__unitaskCloudErrorShown){
        window.__unitaskCloudErrorShown = true;
        alert("No se logró sincronizar con la base compartida. Los cambios permanecen guardados en este navegador.\n\nDetalle: " + message);
        setTimeout(() => window.__unitaskCloudErrorShown = false, 5000);
    }
}

async function supabaseRequest(path, options={}){
    const response = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
        ...options,
        headers:{...SUPABASE_HEADERS, ...(options.headers || {})}
    });
    if(!response.ok){
        const text = await response.text();
        throw new Error(`${response.status}: ${text}`);
    }
    if(response.status === 204) return null;
    const text = await response.text();
    return text ? JSON.parse(text) : null;
}

function courseToDb(c){
    return {id:c.id, name:c.name, code:c.code || "", professor:c.professor || "", schedule:c.schedule || "", classroom:c.room || "", color:c.color || "#7c6df2", notes:c.notes || ""};
}
function courseFromDb(c){
    return {id:c.id, name:c.name, code:c.code || "", professor:c.professor || "", schedule:c.schedule || "", room:c.classroom || "", color:c.color || "#7c6df2", notes:c.notes || ""};
}
function parseResponsibleNames(value){
    if(Array.isArray(value)){
        return [...new Set(value.map(v => String(v || "").trim()).filter(Boolean))];
    }

    const raw = String(value || "").trim();
    if(!raw) return [];

    // Formato nuevo guardado en Supabase: arreglo JSON dentro del campo de texto.
    if(raw.startsWith("[")){
        try{
            const parsed = JSON.parse(raw);
            if(Array.isArray(parsed)){
                return [...new Set(parsed.map(v => String(v || "").trim()).filter(Boolean))];
            }
        }catch(error){
            console.warn("No se logró interpretar la lista de responsables:", error);
        }
    }

    // Compatibilidad con datos anteriores escritos manualmente o con un solo responsable.
    return [...new Set(
        raw.split(/\s*[,;]\s*/).map(v => v.trim()).filter(Boolean)
    )];
}

function getTaskResponsibleNames(task){
    if(Array.isArray(task?.responsibles)){
        return parseResponsibleNames(task.responsibles);
    }
    return parseResponsibleNames(task?.responsible || "");
}

function setTaskResponsibleNames(task, names){
    const clean = parseResponsibleNames(names);
    task.responsibles = clean;
    // Se conserva este campo para compatibilidad con versiones anteriores de UniTask.
    task.responsible = clean.join(", ");
    return clean;
}

function taskHasResponsible(task, name){
    const target = String(name || "").trim().toLowerCase();
    return !!target && getTaskResponsibleNames(task).some(
        responsibleName => responsibleName.toLowerCase() === target
    );
}

function taskToDb(t){
    return {id:t.id, name:t.name, course_id:t.courseId || null, course:t.course || "", type:t.type || "Tarea", status:t.status || "No iniciada", priority:t.priority || "Media", date:t.date || "", time:t.time || "", modality:t.mode || "Individual", progress:Number(t.progress || 0), responsible:JSON.stringify(getTaskResponsibleNames(t)), link:t.link || "", notes:t.notes || ""};
}
function taskFromDb(t){
    const names = parseResponsibleNames(t.responsible || "");
    return {id:t.id, name:t.name, courseId:t.course_id || "", course:t.course || "", type:t.type || "Tarea", status:t.status || "No iniciada", priority:t.priority || "Media", date:t.date || "", time:t.time || "", mode:t.modality || "Individual", progress:Number(t.progress || 0), responsibles:names, responsible:names.join(", "), link:t.link || "", notes:t.notes || ""};
}
function responsibleToDb(r){
    return {id:r.id, name:r.name, color:r.color || getFallbackResponsibleColor(r.name)};
}
function responsibleFromDb(r){
    return {id:r.id, name:r.name || "", color:r.color || getFallbackResponsibleColor(r.name || "")};
}

async function replaceTable(table, rows){
    const existing = await supabaseRequest(`${table}?select=id`);
    const wanted = new Set(rows.map(r => String(r.id)));
    const obsolete = (existing || []).filter(r => !wanted.has(String(r.id)));

    if(rows.length){
        await supabaseRequest(`${table}?on_conflict=id`, {
            method:"POST",
            headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
            body:JSON.stringify(rows)
        });
    }
    for(const row of obsolete){
        await supabaseRequest(`${table}?id=eq.${encodeURIComponent(row.id)}`, {method:"DELETE", headers:{"Prefer":"return=minimal"}});
    }
}

async function syncResponsiblesToCloudOptional(){
    try{
        await replaceTable("responsibles", responsibles.map(responsibleToDb));
        return true;
    }catch(error){
        // La app sigue funcionando aunque la tabla "responsibles" todavía no exista en Supabase.
        console.warn("Catálogo de responsables sin sincronización en Supabase:", error);
        return false;
    }
}

async function loadCloudResponsiblesOptional(){
    try{
        const rows = await supabaseRequest("responsibles?select=*&order=created_at.asc");
        return {available:true, rows:rows || []};
    }catch(error){
        console.warn("No existe o no está disponible la tabla responsibles en Supabase:", error);
        return {available:false, rows:[]};
    }
}

async function syncAllToCloud(){
    // Los cursos se sincronizan primero por la llave foránea de las tareas.
    await replaceTable("courses", courses.map(courseToDb));
    await replaceTable("tasks", tasks.map(taskToDb));
    await syncResponsiblesToCloudOptional();
}

async function loadCloudData(){
    const [cloudCourses, cloudTasks] = await Promise.all([
        supabaseRequest("courses?select=*&order=created_at.asc"),
        supabaseRequest("tasks?select=*&order=created_at.asc")
    ]);
    const responsibleCloud = await loadCloudResponsiblesOptional();

    const hasCloudData = (cloudCourses && cloudCourses.length) || (cloudTasks && cloudTasks.length);
    const hasLocalData = courses.length || tasks.length || responsibles.length;

    cloudReady = true;

    // Primera conexión: si Supabase está vacío, se migran los datos actuales del navegador.
    if(!hasCloudData && hasLocalData){
        ensureResponsiblesFromTasks();
        await syncAllToCloud();
        return;
    }

    courses = (cloudCourses || []).map(courseFromDb);
    tasks = (cloudTasks || []).map(taskFromDb);

    // Si la tabla compartida existe y ya tiene datos, se usan esos responsables.
    // Si está vacía o no existe, se conserva el catálogo local y se completa desde las tareas.
    if(responsibleCloud.available && responsibleCloud.rows.length){
        responsibles = responsibleCloud.rows.map(responsibleFromDb);
    }

    responsibles = responsibles.map(responsible => ({
        ...responsible,
        color: responsible.color || getFallbackResponsibleColor(responsible.name)
    }));

    ensureResponsiblesFromTasks();

    localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    localStorage.setItem(COURSE_KEY, JSON.stringify(courses));
    localStorage.setItem(RESPONSIBLE_KEY, JSON.stringify(responsibles));

    if(responsibleCloud.available && !responsibleCloud.rows.length && responsibles.length){
        await syncResponsiblesToCloudOptional();
    }
}

async function refreshFromCloud(){
    if(!cloudReady) return;
    try{
        const [cloudCourses, cloudTasks] = await Promise.all([
            supabaseRequest("courses?select=*&order=created_at.asc"),
            supabaseRequest("tasks?select=*&order=created_at.asc")
        ]);
        const responsibleCloud = await loadCloudResponsiblesOptional();

        const nextCourses = (cloudCourses || []).map(courseFromDb);
        const nextTasks = (cloudTasks || []).map(taskFromDb);
        let nextResponsibles = responsibles;

        if(responsibleCloud.available){
            nextResponsibles = responsibleCloud.rows.map(responsibleFromDb);
        }

        // También se reconocen nombres antiguos o responsables que ya aparezcan en tareas.
        nextTasks.forEach(task => {
            getTaskResponsibleNames(task).forEach(name => {
                if(name && !nextResponsibles.some(r => r.name.toLowerCase() === name.toLowerCase())){
                    nextResponsibles.push({id:id(), name, color:getFallbackResponsibleColor(name)});
                }
            });
        });

        if(
            JSON.stringify(nextCourses) !== JSON.stringify(courses) ||
            JSON.stringify(nextTasks) !== JSON.stringify(tasks) ||
            JSON.stringify(nextResponsibles) !== JSON.stringify(responsibles)
        ){
            courses = nextCourses;
            tasks = nextTasks;
            responsibles = nextResponsibles;
            localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
            localStorage.setItem(COURSE_KEY, JSON.stringify(courses));
            localStorage.setItem(RESPONSIBLE_KEY, JSON.stringify(responsibles));
            render();
        }
    }catch(error){
        console.error("No se logró actualizar desde Supabase:", error);
    }
}

function formatDate(date){

    if(!date) return "Sin fecha";

    const d = new Date(date + "T12:00:00");

    return d.toLocaleDateString("es-CR",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function isLate(task){

    if(
        !task.date ||
        task.status === "Completada"
    ){
        return false;
    }

    const deadline =
        new Date(
            task.date +
            "T" +
            (task.time || "23:59")
        );

    return deadline < new Date();
}

function statusClass(task){

    if(isLate(task)){
        return "status-late";
    }

    if(task.status === "Completada"){
        return "status-done";
    }

    if(task.status === "En proceso"){
        return "status-progress";
    }

    return "status-no";
}

function statusText(task){

    if(isLate(task)){
        return "Atrasada";
    }

    return task.status;
}

function priorityClass(priority){

    const map = {
        "Baja":"priority-low",
        "Media":"priority-medium",
        "Alta":"priority-high",
        "Urgente":"priority-urgent"
    };

    return map[priority] || "";
}

function getCourse(courseId){

    return courses.find(c => c.id === courseId);
}

function getTaskCourseName(task){

    const course = getCourse(task.courseId);

    return course
        ? course.name
        : task.course || "Sin curso";
}

function ensureResponsiblesFromTasks(){
    let changed = false;

    responsibles = responsibles.map(responsible => {
        const normalizedColor = responsible.color || getFallbackResponsibleColor(responsible.name);
        if(normalizedColor !== responsible.color){
            changed = true;
        }
        return {
            ...responsible,
            color: normalizedColor
        };
    });

    tasks.forEach(task => {
        const names = getTaskResponsibleNames(task);
        setTaskResponsibleNames(task, names);

        names.forEach(name => {
            const exists = responsibles.some(
                r => String(r.name || "").trim().toLowerCase() === name.toLowerCase()
            );

            if(!exists){
                responsibles.push({
                    id:id(),
                    name,
                    color
                });
                changed = true;
            }
        });
    });

    // También normaliza el formato de tareas antiguas aunque no aparezcan responsables nuevos.
    localStorage.setItem(TASK_KEY, JSON.stringify(tasks));

    if(changed){
        localStorage.setItem(RESPONSIBLE_KEY, JSON.stringify(responsibles));
    }
}

function getResponsibleInitials(name=""){
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    return parts.slice(0,2).map(part => part[0]?.toUpperCase() || "").join("") || "R";
}

function getFallbackResponsibleColor(name=""){
    const palette = [
        "#7c6df2",
        "#3b82f6",
        "#14b8a6",
        "#22c55e",
        "#f59e0b",
        "#f97316",
        "#ec4899",
        "#06b6d4"
    ];

    let hash = 0;
    for(const char of String(name)){
        hash = ((hash << 5) - hash) + char.charCodeAt(0);
        hash |= 0;
    }

    return palette[Math.abs(hash) % palette.length];
}

function getResponsibleByName(name=""){
    const target = String(name || "").trim().toLowerCase();
    return responsibles.find(r => String(r.name || "").trim().toLowerCase() === target) || null;
}

function getResponsibleColor(name=""){
    const responsible = getResponsibleByName(name);
    return responsible?.color || getFallbackResponsibleColor(name);
}

/* =========================================================
   MIGRACIÓN AUTOMÁTICA
   Convierte cursos antiguos escritos dentro de tareas
   en cursos independientes.
========================================================= */

function migrateOldCourses(){

    let changed = false;

    tasks.forEach(task => {

        if(task.courseId){
            return;
        }

        const oldName =
            (task.course || "").trim();

        if(!oldName){
            return;
        }

        let course = courses.find(
            c => c.name.toLowerCase() === oldName.toLowerCase()
        );

        if(!course){

            course = {
                id:id(),
                name:oldName,
                code:"",
                professor:"",
                schedule:"",
                room:"",
                color:"#7c6df2",
                notes:""
            };

            courses.push(course);
            changed = true;
        }

        task.courseId = course.id;
        changed = true;
    });

    if(changed){
        save();
    }
}

migrateOldCourses();
ensureResponsiblesFromTasks();

function renderDashboard(){

            t => t.status !== "Completada"

        tasks.filter(

    const completed =
        tasks.filter(
            t => t.status === "Completada"
        );

    const late =
        tasks.filter(isLate);

    const upcoming =
        pending
            .filter(t => t.date)
            .sort(
                (a,b) =>
                new Date(a.date) -
                new Date(b.date)
            )
            .slice(0,7);

    return `

    <div class="stats">

        <div class="stat">
            <div class="stat-label">
                Pendientes
            </div>
            <div class="stat-value">
                ${pending.length}
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                En proceso
            </div>
            <div class="stat-value">
                ${progress.length}
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Completadas
            </div>
            <div class="stat-value">
                ${completed.length}
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                Atrasadas
            </div>
            <div class="stat-value">
                ${late.length}
            </div>
        </div>

    </div>

    <div class="grid">

        <section class="panel">

            <div class="panel-title">
                <h2>Próximas entregas</h2>

                <button
                    class="btn small"
                    onclick="goToView('tasks')">
                    Ver todas
                </button>
            </div>

            ${
                upcoming.length
                ? renderTaskTable(upcoming)
                : emptyState(
                    "📚",
                    "No hay entregas pendientes."
                )
            }

        </section>

        <section class="panel">

            <div class="panel-title">
                <h2>Cursos</h2>

                <button
                    class="btn small"
                    onclick="openCourseModal()">
                    + Agregar
                </button>
            </div>

            ${
                courses.length
                ? courses.map(course => {

                    const count =
                        tasks.filter(
                            t =>
                            t.courseId === course.id &&
                            t.status !== "Completada"
                        ).length;

                    return `
                    <div style="
                        display:flex;
                        align-items:center;
                        gap:10px;
                        padding:10px 0;
                        border-bottom:1px solid var(--border)
                    ">

                        <span style="
                            width:10px;
                            height:10px;
                            border-radius:50%;
                            background:${course.color}
                        "></span>

                        <div style="flex:1">
                            ${escapeHTML(course.name)}
                        </div>

                        <span class="muted">
                            ${count}
                        </span>

                    </div>
                    `;

                }).join("")
                : emptyState(
                    "📘",
                    "Todavía no hay cursos."
                )
            }

        </section>

    </div>
    `;
}

function goToView(view){

    currentView = view;

    document
        .querySelectorAll("[data-view]")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.view === view
            );

    render();
}

function renderTasks(){

    return `

    <div class="filters">

        <input
            class="search"
            id="searchTasks"
            placeholder="🔎 Buscar tarea..."
            oninput="filterTasks()"
        >

        <select
            class="filter-select"
            id="filterCourse"
            onchange="filterTasks()">

            <option value="">
                Todos los cursos
            </option>

            ${courses.map(c => `
                <option value="${c.id}">
                    ${escapeHTML(c.name)}
                </option>
            `).join("")}

        </select>

        <select
            class="filter-select"
            id="filterStatus"
            onchange="filterTasks()">

            <option value="">
                Todos los estados
            </option>

            <option>No iniciada</option>
            <option>En proceso</option>
            <option>Completada</option>

        </select>

        <select
            class="filter-select"
            id="filterPriority"
            onchange="filterTasks()">

            <option value="">
                Todas las prioridades
            </option>

            <option>Baja</option>
            <option>Media</option>
            <option>Alta</option>
            <option>Urgente</option>

        </select>

        <select
            class="filter-select"
            id="filterResponsible"
            onchange="filterTasks()">

            <option value="">
                Todos los responsables
            </option>

            ${responsibles.map(r => `
                <option value="${escapeHTML(r.name)}">
                    ${escapeHTML(r.name)}
                </option>
            `).join("")}

        </select>

    </div>

    <div id="taskListContainer">
        ${renderTaskTable(tasks)}
    </div>
    `;
}

function filterTasks(){

    const text =
        document
            .getElementById("searchTasks")
            .value
            .toLowerCase();

    const course =
        document
            .getElementById("filterCourse")
            .value;

    const status =
        document
            .getElementById("filterStatus")
            .value;

    const priority =
        document
            .getElementById("filterPriority")
            .value;

    const responsible =
        document
            .getElementById("filterResponsible")
            .value;

    const filtered =
        tasks.filter(task => {

            const searchText =
                (
                    task.name +
                    " " +
                    getTaskCourseName(task) +
                    " " +
                    getTaskResponsibleNames(task).join(" ")
                ).toLowerCase();

            return (
                searchText.includes(text) &&
                (!course || task.courseId === course) &&
                (!status || task.status === status) &&
                (!priority || task.priority === priority) &&
                (!responsible || taskHasResponsible(task, responsible))
            );
        });

    document
        .getElementById("taskListContainer")
        .innerHTML =
        renderTaskTable(filtered);
}

function renderTaskResponsibleChips(task){
    const names = getTaskResponsibleNames(task);
    if(!names.length) return "";

    return `
        <div class="task-responsibles">
            ${names.map(name => `
                <span class="task-responsible-chip" style="--chip-color:${getResponsibleColor(name)}">
                    <span class="task-responsible-dot"></span>

                </span>
            `).join("")}

function refreshResponsiblePicker(selectedValues=[]){
    const picker = document.getElementById("taskResponsiblePicker");
    if(!picker) return;

    const selected = new Set(parseResponsibleNames(selectedValues).map(name => name.toLowerCase()));
    const ordered = responsibles
        .slice()
        .sort((a,b) => a.name.localeCompare(b.name, "es"));

    if(!ordered.length){
        picker.className = "responsible-picker empty-picker";
        picker.innerHTML = `No hay responsables registrados. Cerrá esta ventana y agregá uno con el botón “+ Responsable”.`;
        return;
    }

    picker.className = "responsible-picker";
    picker.innerHTML = ordered.map(responsible => {
        const isSelected = selected.has(responsible.name.toLowerCase());
        const accent = getResponsibleColor(responsible.name);
        return `
            <label class="responsible-option ${isSelected ? "selected" : ""}" style="--resp-accent:${accent}">
                <input
                    type="checkbox"
                    class="task-responsible-check"
                    value="${escapeHTML(responsible.name)}"
                    ${isSelected ? "checked" : ""}
                    onchange="this.closest('.responsible-option').classList.toggle('selected', this.checked)">
                <span class="responsible-option-avatar">${escapeHTML(getResponsibleInitials(responsible.name))}</span>
                <span class="responsible-option-name">${escapeHTML(responsible.name)}</span>
            </label>
        `;
    }).join("");
}

function getSelectedTaskResponsibles(){
    return [...document.querySelectorAll(".task-responsible-check:checked")].map(checkbox => checkbox.value);
}

            };

                data.progress = 100;

                    );

function editTask(taskId){

    const task =
        tasks.find(
            t => t.id === taskId
        );

    if(task){
        openTaskModal(task);
    }
}

function confirmDeletion(elementName){
    const firstConfirmation = confirm(
        `¿Seguro que querés eliminar "${elementName}"?\n\nEsta acción eliminará la información seleccionada.`
    );

    if(!firstConfirmation){
        return false;
    }

    const secondConfirmation = confirm(
        `CONFIRMACIÓN FINAL\n\n¿Querés eliminar definitivamente "${elementName}"?\n\nEsta acción no se puede deshacer.`
    );

    return secondConfirmation;
}

function deleteTask(taskId){

    const task = tasks.find(t => t.id === taskId);

    if(!task){
        return;
    }

    if(!confirmDeletion(`la tarea ${task.name}`)){
        return;
    }

    tasks = tasks.filter(t => t.id !== taskId);
    save();
    render();
}

function saveCourseFromForm(){
    const form = document.getElementById("courseForm");
    const nameInput = document.getElementById("courseName");
    const codeInput = document.getElementById("courseCode");
    const professorInput = document.getElementById("courseProfessor");
    const scheduleInput = document.getElementById("courseSchedule");
    const roomInput = document.getElementById("courseRoom");
    const colorInput = document.getElementById("courseColor");
    const notesInput = document.getElementById("courseNotes");

    if (!form.reportValidity()) return;

    const name = nameInput.value.trim();
    const duplicate = courses.find(c =>
        String(c.name || "").trim().toLowerCase() === name.toLowerCase() &&
        c.id !== editingCourseId
    );

    if (duplicate) {
        alert("Ya existe un curso con ese nombre.");
        return;
    }

    const data = {
        id: editingCourseId || id(),
        name,
        code: codeInput.value.trim(),
        professor: professorInput.value.trim(),
        schedule: scheduleInput.value.trim(),
        room: roomInput.value.trim(),
        color: colorInput.value || "#7c6df2",
        notes: notesInput.value.trim()
    };

    if (editingCourseId) {
        const index = courses.findIndex(c => c.id === editingCourseId);
        if (index < 0) {
            alert("No se encontró el curso que se intenta editar.");
            return;
        }
        courses[index] = data;
        tasks.forEach(task => {
            if (task.courseId === editingCourseId) task.course = data.name;
        });
    } else {
        courses.push(data);
    }

    try {
        save();
    } catch (error) {
        console.error(error);
        alert("No se logró guardar el curso en este navegador.");
        return;
    }

    editingCourseId = null;
    form.reset();
    document.getElementById("courseDialog").close();
    render();
}

document.getElementById("saveCourseBtn").addEventListener("click", saveCourseFromForm);
document.getElementById("courseForm").addEventListener("submit", event => {
    event.preventDefault();
    saveCourseFromForm();
});

function editCourse(courseId){

    const course =
        courses.find(
            c => c.id === courseId
        );

    if(course){
        openCourseModal(course);
    }
}

function deleteCourse(courseId){

    const course =
        courses.find(
            c => c.id === courseId
        );

    if(!course){
        return;
    }

    const related =
        tasks.filter(
            t => t.courseId === courseId
        );

    if(related.length){

        alert(
            `No se puede eliminar "${course.name}" porque tiene ${related.length} tarea(s) asociada(s).\n\nEliminá o cambiá esas tareas primero.`
        );

        return;
    }

    if(!confirmDeletion(`el curso ${course.name}`)){
        return;
    }

    courses = courses.filter(c => c.id !== courseId);
    save();
    render();
}

function renderResponsibles(){

    if(!responsibles.length){

        return `
        <div class="panel">

            ${emptyState(
                "👥",
                "Todavía no hay responsables registrados."
            )}

            <div style="text-align:center">

                <button
                    class="btn primary"
                    onclick="openResponsibleModal()">
                    + Agregar primer responsable
                </button>

            </div>

        </div>
        `;
    }

    const ordered = responsibles
        .slice()
        .sort((a,b) => a.name.localeCompare(b.name, "es"));

    return `

    <div class="responsible-grid">

        ${ordered.map(responsible => {

            const assignedTasks =
                tasks.filter(
                    t => taskHasResponsible(t, responsible.name)
                );

            const pendingTasks =
                assignedTasks
                    .filter(t => t.status !== "Completada")
                    .sort((a,b) => {
                        if(!a.date && !b.date) return a.name.localeCompare(b.name, "es");
                        if(!a.date) return 1;
                        if(!b.date) return -1;
                        return new Date(a.date + "T" + (a.time || "23:59")) -
                               new Date(b.date + "T" + (b.time || "23:59"));
                    });

            const completed =
                assignedTasks.filter(
                    t => t.status === "Completada"
                ).length;

            const accent = getResponsibleColor(responsible.name);

            return `

            <div class="responsible-card" style="--resp-accent:${accent}">

                <div class="responsible-head">

                    <div class="responsible-avatar">
                        ${escapeHTML(getResponsibleInitials(responsible.name))}
                    </div>

                    <div style="min-width:0">
                        <div class="responsible-name">
                            ${escapeHTML(responsible.name)}
                        </div>

                        <div class="responsible-meta">
                            Resumen de carga asignada
                        </div>
                    </div>

                </div>

                <div class="responsible-stats">
                    <span class="responsible-stat">
                        📋 ${assignedTasks.length} total
                    </span>
                    <span class="responsible-stat pending">
                        ⏳ ${pendingTasks.length} pendiente(s)
                    </span>
                    <span class="responsible-stat">
                        ✅ ${completed} completada(s)
                    </span>
                </div>

                <div class="responsible-actions">

                    <button
                        class="btn small pending-btn"
                        ${pendingTasks.length ? "" : "disabled"}
                        onclick="toggleResponsiblePending('${responsible.id}', this)">
                        ${pendingTasks.length ? `Ver pendientes (${pendingTasks.length})` : "Sin pendientes"}
                    </button>

                    <button
                        class="btn small"
                        onclick="editResponsible('${responsible.id}')">
                        Editar
                    </button>

                    <button
                        class="btn small danger"
                        onclick="deleteResponsible('${responsible.id}')">
                        Eliminar
                    </button>

                </div>

                <div class="responsible-pending" id="pending-${responsible.id}">

                    <div class="responsible-pending-title">
                        <span>📌 Pendientes de ${escapeHTML(responsible.name)}</span>
                        <span class="muted">${pendingTasks.length}</span>
                    </div>

                    ${pendingTasks.length ? `
                        <div class="pending-task-list">
                            ${pendingTasks.map(task => {
                                const course = getCourse(task.courseId);
                                const courseColor = course?.color || accent;
                                const delivery = task.date
                                    ? `${formatDate(task.date)}${task.time ? " · " + escapeHTML(task.time) : ""}`
                                    : "Sin fecha";

                                return `
                                <div class="pending-task-item" style="--task-color:${courseColor}">
                                    <div style="min-width:0">
                                        <div class="pending-task-name">
                                            ${escapeHTML(task.name)}
                                        </div>
                                        <div class="pending-task-meta">
                                            ${escapeHTML(getTaskCourseName(task))} · ${delivery}<br>
                                            <span class="${priorityClass(task.priority)}">${escapeHTML(task.priority || "Media")}</span>
                                            · ${escapeHTML(statusText(task))}
                                        </div>
                                    </div>

                                    <div class="pending-task-actions">
                                        <button
                                            class="btn small"
                                            onclick="editTask('${task.id}')"
                                            title="Editar tarea">
                                            Ver
                                        </button>
                                    </div>
                                </div>
                                `;
                            }).join("")}
                        </div>
                    ` : `
                        <div class="pending-empty">
                            No hay tareas pendientes para esta persona.
                        </div>
                    `}

                </div>

            </div>
            `;

        }).join("")}

    </div>
    `;
}

function toggleResponsiblePending(responsibleId, button){
    const panel = document.getElementById(`pending-${responsibleId}`);
    if(!panel) return;

    const opening = !panel.classList.contains("open");
    panel.classList.toggle("open", opening);

    if(button){
        const responsible = responsibles.find(r => r.id === responsibleId);
        const count = responsible
            ? tasks.filter(t => taskHasResponsible(t, responsible.name) && t.status !== "Completada").length
            : 0;
        button.textContent = opening ? "Ocultar pendientes" : `Ver pendientes (${count})`;
    }
}

document
    .getElementById("responsibleForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

            const name =
                document
                    .getElementById("responsibleName")
                    .value
                    .trim();

            const color =
                document
                    .getElementById("responsibleColor")
                    .value || getFallbackResponsibleColor(name);

            if(!name){
                return;
            }

            const duplicate = responsibles.find(
                r =>
                    r.id !== editingResponsibleId &&
                    String(r.name || "").trim().toLowerCase() === name.toLowerCase()
            );

            if(duplicate){
                alert("Ya existe un responsable con ese nombre.");
                return;
            }

            if(editingResponsibleId){

                const index =
                    responsibles.findIndex(
                        r => r.id === editingResponsibleId
                    );

                if(index < 0){
                    alert("No se encontró el responsable que se intenta editar.");
                    return;
                }

                const oldName = responsibles[index].name;

                responsibles[index] = {
                    ...responsibles[index],
                    name,
                    color
                };

                // Al cambiar el nombre, también se actualizan todas las tareas donde participe.
                tasks.forEach(task => {
                    const updated = getTaskResponsibleNames(task).map(assignedName =>
                        assignedName === oldName ? name : assignedName
                    );
                    setTaskResponsibleNames(task, updated);
                });

            }else{

                responsibles.push({
                    id:id(),
                    name,
                    color
                });
            }

            save();

            closeResponsibleModal();

            render();
        }
    );

function editResponsible(responsibleId){

    const responsible =
        responsibles.find(
            r => r.id === responsibleId
        );

    if(responsible){
        openResponsibleModal(responsible);
    }
}

function deleteResponsible(responsibleId){

    const responsible =
        responsibles.find(
            r => r.id === responsibleId
        );

    if(!responsible){
        return;
    }

    const related =
        tasks.filter(
            t => taskHasResponsible(t, responsible.name)
        );

    const warning = related.length
        ? `\n\nParticipa en ${related.length} tarea(s). Si se elimina, se quitará únicamente su asignación; los demás responsables de esas tareas se conservarán.`
        : "";

    const firstConfirmation = confirm(
        `¿Seguro que querés eliminar al responsable "${responsible.name}"?${warning}`
    );

    if(!firstConfirmation){
        return;
    }

    const secondConfirmation = confirm(
        `CONFIRMACIÓN FINAL\n\n¿Querés eliminar definitivamente a "${responsible.name}"?`
    );

    if(!secondConfirmation){
        return;
    }

    tasks.forEach(task => {
        if(taskHasResponsible(task, responsible.name)){
            const remaining = getTaskResponsibleNames(task).filter(
                name => name !== responsible.name
            );
            setTaskResponsibleNames(task, remaining);
        }
    });

    responsibles =
        responsibles.filter(
            r => r.id !== responsibleId
        );

    save();
    render();
}

/* =========================================================
   CALENDARIO
========================================================= */

function renderCalendar(){
    const year = calendarCursor.getFullYear();
    const month = calendarCursor.getMonth();
    const first = new Date(year, month, 1);
    const mondayIndex = (first.getDay() + 6) % 7;
    const gridStart = new Date(year, month, 1 - mondayIndex);
    const monthTitle = new Intl.DateTimeFormat("es-CR", {month:"long", year:"numeric"}).format(first);
    const weekdays = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
    const today = new Date();

    let cells = "";
    for(let i=0;i<42;i++){
        const day = new Date(gridStart);
        day.setDate(gridStart.getDate()+i);
        const iso = localISO(day);
        const dayTasks = tasks
            .filter(t => t.date === iso && t.status !== "Completada")
            .sort((a,b)=>(a.time||"23:59").localeCompare(b.time||"23:59"));
        const other = day.getMonth() !== month ? " other" : "";
        const isToday = day.getFullYear()===today.getFullYear() && day.getMonth()===today.getMonth() && day.getDate()===today.getDate() ? " today" : "";
        cells += `<div class="calendar-day${other}${isToday}">
            <div class="calendar-number">${day.getDate()}</div>
            ${dayTasks.map(t=>{
                const c=getCourse(t.courseId);
                return `<button class="calendar-task" style="border-left-color:${c?.color||'#7c6df2'}" onclick="showCalendarTask('${t.id}')" title="Ver detalle">
                    <div class="calendar-task-title">${escapeHTML(t.name)}</div>
                    <div class="calendar-task-meta">${t.time?escapeHTML(t.time)+' · ':''}${escapeHTML(getTaskCourseName(t))}</div>
                </button>`;
            }).join("")}
        </div>`;
    }

    return `<div class="panel">
        <div class="calendar-toolbar">
            <button class="btn" onclick="changeCalendarMonth(-1)">← Anterior</button>
            <h2>${escapeHTML(monthTitle)}</h2>
            <div style="display:flex;gap:8px"><button class="btn" onclick="goCalendarToday()">Hoy</button><button class="btn" onclick="changeCalendarMonth(1)">Siguiente →</button></div>
        </div>
        <div class="calendar-scroll"><div class="calendar-grid">
            ${weekdays.map(w=>`<div class="calendar-weekday">${w}</div>`).join("")}
            ${cells}
        </div></div>
        <div id="calendarDetail" class="calendar-detail"></div>
    </div>`;
}

function localISO(d){
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
}

function changeCalendarMonth(delta){
    calendarCursor.setMonth(calendarCursor.getMonth()+delta);
    render();
}

function goCalendarToday(){
    calendarCursor = new Date();
    calendarCursor.setDate(1);
    render();
}

function showCalendarTask(taskId){
    const task=tasks.find(t=>t.id===taskId);
    const box=document.getElementById("calendarDetail");
    if(!task||!box)return;
    box.innerHTML=`<div class="panel" style="background:var(--card2)">
        <div class="panel-title"><h2>${escapeHTML(task.name)}</h2><button class="btn small" onclick="editTask('${task.id}')">Editar tarea</button></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
            <div><span class="muted">Curso</span><br>${escapeHTML(getTaskCourseName(task))}</div>
            <div><span class="muted">Tipo</span><br>${escapeHTML(task.type||"Tarea")}</div>
            <div><span class="muted">Estado</span><br><span class="badge ${statusClass(task)}">${escapeHTML(statusText(task))}</span></div>
            <div><span class="muted">Prioridad</span><br>${escapeHTML(task.priority||"Media")}</div>
            <div><span class="muted">Entrega</span><br>${formatDate(task.date)}${task.time?" · "+escapeHTML(task.time):""}</div>
            <div><span class="muted">Progreso</span><br>${Number(task.progress||0)}%</div>
            <div><span class="muted">Modalidad</span><br>${escapeHTML(task.mode||"Individual")}</div>
            <div><span class="muted">Responsable(s)</span><br>${getTaskResponsibleNames(task).length ? getTaskResponsibleNames(task).map(name => escapeHTML(name)).join(" · ") : "Sin registrar"}</div>
        </div>
        ${task.notes?`<div style="margin-top:14px"><span class="muted">Notas</span><p>${escapeHTML(task.notes)}</p></div>`:""}
        ${task.link?`<div style="margin-top:10px"><button class="btn small" onclick="window.open('${escapeHTML(task.link)}','_blank','noopener')">Abrir enlace</button></div>`:""}
    </div>`;
    box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* =========================================================
   CIERRE SEGURO DE MODALES
========================================================= */

/*
   X:
   cierra sin guardar.

   Cancelar:
   cierra sin guardar.

   ESC:
   cierra sin guardar.

   Clic fuera:
   cierra sin guardar.
*/

function configureDialog(dialog, closeFunction){

    dialog.addEventListener(
        "cancel",
        event => {

            event.preventDefault();

            closeFunction();
        }
    );

    dialog.addEventListener(
        "click",
        event => {

            if(event.target !== dialog){
                return;
            }

            const rect =
                dialog.getBoundingClientRect();

            const inside =
                event.clientX >= rect.left &&
                event.clientX <= rect.right &&
                event.clientY >= rect.top &&
                event.clientY <= rect.bottom;

            if(!inside){
                closeFunction();
            }
        }
    );
}

configureDialog(
    document.getElementById("taskDialog"),
    closeTaskModal
);

configureDialog(
    document.getElementById("courseDialog"),
    closeCourseModal
);

configureDialog(
    document.getElementById("responsibleDialog"),
    closeResponsibleModal
);

/* =========================================================
   EXPORTAR RESPALDO
========================================================= */

function exportData(){

    const backup = {

        app:"UniTask",

        version:4,

        exportedAt:
            new Date().toISOString(),

        courses:courses,

        responsibles:responsibles,

        tasks:tasks
    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "UniTask_respaldo_" +
        new Date()
            .toISOString()
            .slice(0,10) +
        ".json";

    a.click();

    URL.revokeObjectURL(url);
}

/* =========================================================
   IMPORTAR RESPALDO
========================================================= */

function importData(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = e => {

        try{

            const data =
                JSON.parse(e.target.result);

            let importedTasks = [];
            let importedCourses = [];
            let importedResponsibles = [];

            /*
               Respaldo nuevo
            */

            if(
                data &&
                Array.isArray(data.tasks)
            ){

                importedTasks =
                    data.tasks;

                importedCourses =
                    Array.isArray(data.courses)
                    ? data.courses
                    : [];

                importedResponsibles =
                    Array.isArray(data.responsibles)
                    ? data.responsibles
                    : [];

            }

            /*
               Compatibilidad con respaldo
               antiguo que era únicamente
               un arreglo de tareas.
            */

            else if(Array.isArray(data)){

                importedTasks =
                    data;
            }

            else{

                throw new Error(
                    "Formato no reconocido"
                );
            }

            if(
                !confirm(
                    "El respaldo reemplazará los datos actuales de este navegador. ¿Continuar?"
                )
            ){
                return;
            }

            tasks =
                importedTasks;

            courses =
                importedCourses;

            responsibles =
                importedResponsibles;

            ensureResponsiblesFromTasks();

            save();

            /*
               Si el respaldo era antiguo,
               genera los cursos desde
               las tareas.
            */

            migrateOldCourses();

            save();

            render();

            alert(
                "Respaldo importado correctamente."
            );

        }catch(error){

            alert(
                "No se pudo importar el archivo. Verificá que sea un respaldo válido de UniTask."
            );
        }

        event.target.value = "";
    };

    reader.readAsText(file);
}

/* =========================================================
   INICIO
========================================================= */

async function startUniTask(){
    // Se muestra inmediatamente el respaldo local mientras llega la nube.
    render();
    try{
        await loadCloudData();
        render();
        // Actualización automática para reflejar cambios de otros integrantes.
        setInterval(refreshFromCloud, 5000);
    }catch(error){
        cloudReady = false;
        showCloudError(error);
    }
}

startUniTask();
